name: Update TryHackMe Badge

on:
  schedule:
    - cron: '17 * * * *'   # every hour at minute 17 (avoid :00 congestion)
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libxss1 libasound2t64 libatk-bridge2.0-0 libgtk-3-0 \
            libgbm-dev libdrm-dev libxshmfence-dev fonts-liberation \
            fonts-noto-cjk fonts-noto-color-emoji chromium-browser || \
            sudo apt-get install -y -qq chromium || true
          which chromium-browser || which chromium || which google-chrome || echo "No system chromium found, Puppeteer will use bundled"

      - name: Install dependencies
        run: npm install

      - name: Generate badge screenshot
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DEBUG: '1'
        run: node index.js

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 7

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/uploadme.png
          if ! git diff --cached --quiet; then
            git commit -m "Updated TryHackMe badge (live stats)"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
